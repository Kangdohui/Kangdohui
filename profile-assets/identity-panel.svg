  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#A9C4FF" stroke-opacity=".07"/></pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="18"/></filter>
</defs>
