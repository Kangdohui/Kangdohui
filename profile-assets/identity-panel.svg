<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">Kang Dohui — ESTJ × 庚辰</title>
<desc id="desc">A custom profile card combining an ESTJ test result with a traditional symbolic saju keyword, without birth data.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10182E"/><stop offset=".58" stop-color="#18284B"/><stop offset="1" stop-color="#253D70"/></linearGradient>
